[build]
cmds = [
  "npm ci",
  "npx prisma generate"
]

[start]
# Schema/migraciones fuera del build (ver DEPLOY.md)
cmd = "next start"

[env]
# PostgreSQL via DATABASE_URL (secret en Coolify/Dokploy)
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[cacheDirs]
# Cachear node_modules entre builds
"node_modules" = "node_modules"
# Cachear Prisma generated client
".prisma" = ".prisma"
"dist" = "dist"
